name: Bump version

# Opens a release pull request. Merging it moves the manifest version to main,
# which is what the Release workflow publishes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    name: Open the version bump pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compute the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'EOF'
          import json
          import os
          import pathlib
          import re

          path = pathlib.Path(
              "custom_components/fermeture_ecole_quebec/manifest.json"
          )
          text = path.read_text(encoding="utf-8")
          manifest = json.loads(text)
          major, minor, patch = (
              int(part) for part in manifest["version"].split(".")
          )
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unknown bump {bump!r}")

          version = f"{major}.{minor}.{patch}"
          # Only rewrite the version value so the manifest keeps its layout.
          text, count = re.subn(
              r'("version":\s*")\d+\.\d+\.\d+(")',
              rf"\g<1>{version}\g<2>",
              text,
          )
          if count != 1:
              raise SystemExit("Could not find a single version in the manifest")
          path.write_text(text, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\ntag=v{version}\n")
          print(f"Next version: {version}")
          EOF

      - name: Commit on a release branch
        id: branch
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          branch="release/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add custom_components/fermeture_ecole_quebec/manifest.json
          git commit -m "chore(release): $TAG"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): $TAG" \
            --body "Bump the integration version to ${TAG#v}."
