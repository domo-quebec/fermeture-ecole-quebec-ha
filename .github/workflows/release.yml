name: Release

# The manifest version is the single source of truth: every push to main that
# carries a version without a tag gets one, and a release named after the tag.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the manifest version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.state.outputs.tag_exists }}
      release_exists: ${{ steps.state.outputs.release_exists }}
      previous_tag: ${{ steps.state.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read the manifest version
        id: version
        run: |
          python - <<'EOF'
          import json
          import os
          import pathlib
          import re

          path = pathlib.Path(
              "custom_components/fermeture_ecole_quebec/manifest.json"
          )
          manifest = json.loads(path.read_text(encoding="utf-8"))
          version = manifest["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid manifest version {version!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\ntag=v{version}\n")
          print(f"Manifest version: {version}")
          EOF

      - name: Look for an existing tag and release
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi
          previous_tag="$(
            git tag --sort=-version:refname --list 'v*' | grep -vx "$TAG" | head -n 1
          )"
          {
            echo "tag_exists=$tag_exists"
            echo "release_exists=$release_exists"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $TAG: tag exists=$tag_exists, release exists=$release_exists, previous=${previous_tag:-none}"

  release:
    name: Publish the release
    needs: check
    if: needs.check.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install ruff -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

      - name: Create the tag
        if: needs.check.outputs.tag_exists == 'false'
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.check.outputs.previous_tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
            CHANGELOG="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
          else
            RANGE="$TAG"
            CHANGELOG="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi

          {
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" \
              | grep -vE -- '^- (chore\(release\)|Bump version to) ' || true
            printf '\n\n**Full changelog**: %s\n' "$CHANGELOG"
          } > release-notes.md

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md
